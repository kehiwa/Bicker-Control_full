name: Test and build development wheel

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --editable ".[test]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build development wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: bicker-control-python-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-arm64-deb:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Debian package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile.arm64
          platforms: linux/arm64
          outputs: type=local,dest=dist

      - name: Create package checksum
        shell: bash
        run: sha256sum dist/*.deb > dist/SHA256SUMS

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: bicker-control-arm64-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
              --generate-notes --title "$GITHUB_REF_NAME"
          fi