[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bicker-control-full"
version = "0.1.0"
description = "Network controller for the Bicker UPSI-2412D"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115,<1",
	"pyserial>=3.5",
	"uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
device = ["lgpio>=0.2.2", "pysnmp>=7,<8"]

[project.scripts]
bicker-control = "bicker_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bicker_control = ["static/*", "mibs/*"]

[tool.unittest]
start-directory = "tests"